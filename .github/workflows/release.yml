name: Release

on:
  release:
    types: [published, prereleased]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-release:
    name: Test and Build Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Tests
        run: go test -v ./...

      - name: Build Multi-Platform Binaries and Archives
        run: |
          mkdir -p dist

          PLATFORMS=(
            "linux/amd64"
            "linux/arm64"
            "linux/arm/7"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
            "freebsd/amd64"
          )

          for PLATFORM in "${PLATFORMS[@]}"; do
            GOOS="${PLATFORM%%/*}"
            GOARCH_ARM="${PLATFORM#*/}"
            GOARCH="${GOARCH_ARM%%/*}"
            GOARM=""
            if [[ "$GOARCH_ARM" == *"/"* ]]; then
              GOARM="${GOARCH_ARM#*/}"
            fi

            BIN_NAME="zoraxy-geoheaders"
            ARCH_NAME="${GOOS}_${GOARCH}"
            if [ -n "$GOARM" ]; then
              ARCH_NAME="${GOOS}_${GOARCH}v${GOARM}"
            fi

            if [ "$GOOS" = "windows" ]; then
              BIN_NAME="zoraxy-geoheaders.exe"
            fi

            BUILD_DIR="dist/${ARCH_NAME}"
            mkdir -p "${BUILD_DIR}"

            echo "Building for $GOOS/$GOARCH (GOARM=$GOARM)..."
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" GOARM="$GOARM" go build -ldflags="-s -w" -o "${BUILD_DIR}/${BIN_NAME}" .
            cp .introspect README.md "${BUILD_DIR}/"

            # Copy standalone binary file
            STANDALONE_NAME="zoraxy-geoheaders_${ARCH_NAME}"
            if [ "$GOOS" = "windows" ]; then
              STANDALONE_NAME="zoraxy-geoheaders_${ARCH_NAME}.exe"
            fi
            cp "${BUILD_DIR}/${BIN_NAME}" "dist/${STANDALONE_NAME}"

            # Create archive containing binary + .introspect + README.md
            cd dist
            if [ "$GOOS" = "windows" ]; then
              ZIP_NAME="zoraxy-geoheaders_${ARCH_NAME}.zip"
              zip -r "${ZIP_NAME}" "${ARCH_NAME}"
            else
              TAR_NAME="zoraxy-geoheaders_${ARCH_NAME}.tar.gz"
              tar -czf "${TAR_NAME}" "${ARCH_NAME}"
            fi
            rm -rf "${ARCH_NAME}"
            cd ..
          done

          # Generate SHA-256 Checksums
          cd dist
          sha256sum * > checksums.txt
          cd ..

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
